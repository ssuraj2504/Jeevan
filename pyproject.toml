[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jeevan-agent"
version = "0.1.0"
description = "Voice and browser agent for completing household bookings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.41,<3",
  "pydantic-settings>=2.10,<3",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.54,<2"]
voice = ["livekit-agents[openai,silero]>=1.2,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["browser: requires a locally installed Playwright browser"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
