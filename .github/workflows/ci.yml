name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser]"
          python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check app tests tools
      - name: Test API and browser flows
        env:
          RUN_BROWSER_E2E: "1"
          DATABASE_URL: sqlite:////tmp/jeevan-ci.db
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/jeevan-uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          for _ in range(100):
              try:
                  with urlopen("http://127.0.0.1:8000/health", timeout=1) as response:
                      if response.status == 200:
                          break
              except (OSError, URLError):
                  time.sleep(0.1)
          else:
              raise SystemExit("Jeevan server did not become healthy")
          PY
          python -m pytest
